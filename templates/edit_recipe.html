{% extends "base.html" %}

{% block title %}Edit recipe - RecipeDB{% endblock %}

{% block content %}
<h2>Edit recipe</h2>
<form action="{{ url_for('update_recipe') }}" method="post">
  <input name="csrf_token" type="hidden" value="{{ session.csrf_token }}" />
  <input name="recipe_id" type="hidden" value="{{ recipe.id }}" />

  <label for="title">Title</label>
  <input id="title" name="title" type="text" maxlength="100" value="{{ recipe.title }}" required />

  <label for="ingredients">Ingredients</label>
  <textarea id="ingredients" name="ingredients" maxlength="5000" required>{{ recipe.ingredients }}</textarea>

  <label for="instructions">Instructions</label>
  <textarea id="instructions" name="instructions" maxlength="10000" required>{{ recipe.instructions }}</textarea>

  <fieldset>
    <legend>Classifications</legend>
    {% for class in classes %}
    <label>
      <input name="class_ids" type="checkbox" value="{{ class.id }}"
        {% if class.id in selected_class_ids %}checked{% endif %} />
      {{ class.title }}: {{ class.value }}
    </label>
    {% endfor %}
  </fieldset>

  <button type="submit">Save changes</button>
</form>
{% endblock %}
