{% extends "base.html" %}

{% block title %}Delete recipe - RecipeDB{% endblock %}

{% block content %}
<h2>Delete recipe</h2>
<p>Delete &quot;{{ recipe.title }}&quot;?</p>
<form action="{{ url_for('remove_recipe', recipe_id=recipe.id) }}" method="post">
  <button type="submit">Delete recipe</button>
  <a href="{{ url_for('show_recipe', recipe_id=recipe.id) }}">Cancel</a>
</form>
{% endblock %}
